<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>六合彩分析 · 特码/平码/三中三推荐</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #1a237e;
      --danger: #e53935;
      --warning: #ff9800;
      --info: #2196f3;
      --bg: #f5f7fb;
      --card-bg: #ffffff;
      --shadow: 0 4px 12px rgba(0,0,0,0.06);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: #333;
      padding: 12px;
      max-width: 1000px;
      margin: 0 auto;
      line-height: 1.5;
    }
    h1 { text-align: center; font-size: 1.8rem; margin: 8px 0 16px; color: var(--primary); }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }
    .actions {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px;
    }
    .btn {
      font-weight: 600; border: none; padding: 12px 20px; border-radius: 30px;
      cursor: pointer; font-size: 0.95rem; display: inline-flex; align-items: center;
      gap: 6px; transition: 0.2s; background: var(--primary); color: white;
      white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    .btn-danger { background: var(--danger); }
    .btn-warning { background: #f57c00; }
    .file-status {
      font-size: 0.9rem; color: #555; flex: 1; min-width: 120px; word-break: break-all;
    }
    .settings {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 12px 0;
    }
    .settings select, .settings input {
      padding: 10px 14px; border-radius: 30px; border: 1px solid #ccc;
      background: #fff; font-size: 0.9rem; min-width: 110px;
    }
    .section-title {
      font-size: 1.3rem; font-weight: 700; color: var(--primary); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .grid-2col {
      display: flex; flex-wrap: wrap; gap: 18px; margin-top: 18px;
    }
    .col {
      flex: 1 1 300px; background: #fafbfc; border-radius: var(--radius);
      padding: 14px; box-shadow: var(--shadow);
    }
    /* 表格优化：完全适应手机，无横向滚动 */
    .table-responsive {
      width: 100%; overflow-x: visible; margin-bottom: 12px;
    }
    table {
      width: 100%; border-collapse: collapse; font-size: 0.82rem;
      table-layout: auto;
    }
    th, td {
      padding: 8px 4px; text-align: center; border-bottom: 1px solid #eee;
      word-break: keep-all;
    }
    th {
      background: var(--primary); color: white; font-weight: 600;
      position: sticky; top: 0; z-index: 2;
    }
    td:first-child, th:first-child { padding-left: 6px; }
    td:last-child, th:last-child { padding-right: 6px; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-weight: 600; font-size: 0.7rem; color: white; line-height: 1.4;
    }
    .hot { background: var(--danger); }
    .warm { background: var(--warning); }
    .cold { background: var(--info); }

    .chart-wrap {
      position: relative; height: 280px; width: 100%; margin: 12px 0;
    }
    .recommend-box {
      background: #fff8e1; border: 2px solid #ffb300; border-radius: 20px;
      padding: 18px; margin-top: 18px; text-align: center;
    }
    .number-circles {
      display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 16px 0;
    }
    .num-circle {
      width: 70px; height: 70px; background: linear-gradient(135deg, #e53935, #b71c1c);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 800; color: white; box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }
    .modal {
      display: none; position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center;
    }
    .modal-content {
      background: #fff; border-radius: 20px; padding: 20px;
      width: 90%; max-width: 600px; max-height: 80vh; display: flex; flex-direction: column;
    }
    .modal-content h3 { margin-bottom: 8px; color: var(--primary); }
    .modal-content textarea {
      width: 100%; flex:1; min-height: 220px; border:1px solid #ccc; border-radius:12px;
      padding:12px; font-size:0.9rem; resize: vertical; font-family: monospace;
    }
    .modal-actions { display:flex; gap:12px; justify-content: flex-end; margin-top: 16px; }
    @media (max-width: 480px) {
      body { padding: 8px; }
      .btn { padding: 10px 16px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <h1>🐲 六合彩分析工具</h1>

  <!-- 数据加载卡片 -->
  <div class="card">
    <div class="actions">
      <input type="file" id="csvFile" accept="text/csv,.csv,text/plain" style="display:none;">
      <button class="btn" onclick="document.getElementById('csvFile').click()">📂 选择文件</button>
      <button class="btn btn-outline" id="pasteBtn">📋 粘贴 CSV</button>
      <span class="file-status" id="fileStatus">未加载数据</span>
    </div>
    <div class="settings">
      <label>特码位置：</label>
      <select id="specialPos">
        <option value="last" selected>最后一码</option>
        <option value="first">第一码</option>
      </select>
      <label>分析期数：</label>
      <input type="number" id="recentPeriods" value="0" min="0" style="width:80px;" placeholder="0=全部">
      <span style="font-size:0.8rem;color:#666;">（0=所有期）</span>
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <button class="btn btn-danger" id="analyzeBtn">🔍 开始生肖分析</button>
      <button class="btn btn-warning" id="recommendBtn">🎰 推荐三中三</button>
      <button class="btn" id="specialNumBtn">🎯 特码号码分析</button>
    </div>
  </div>

  <!-- 生肖分析结果区 -->
  <div id="zodiacResult" style="display:none;">
    <div class="grid-2col">
      <div class="col">
        <div class="section-title">🎯 特码生肖</div>
        <div class="table-responsive">
          <table id="specialTable">
            <thead><tr><th>生肖</th><th>次数</th><th>概率</th><th>状态</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="chart-wrap"><canvas id="specialChart"></canvas></div>
      </div>
      <div class="col">
        <div class="section-title">🔄 平码生肖</div>
        <div class="table-responsive">
          <table id="normalTable">
            <thead><tr><th>生肖</th><th>次数</th><th>概率</th><th>状态</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="chart-wrap"><canvas id="normalChart"></canvas></div>
      </div>
    </div>
  </div>

  <!-- 三中三推荐区 -->
  <div id="recommendArea" style="display:none;">
    <div class="card recommend-box">
      <h2 style="color:#f57f17;">🎯 本期三中三推荐号码</h2>
      <div class="number-circles" id="recommendNumbers"></div>
      <p style="font-weight:500;">算法：平码总次数 + 近30期热度 – 遗漏值</p>
    </div>
  </div>

  <!-- 特码号码分析区 -->
  <div id="specialNumArea" style="display:none;">
    <div class="card">
      <div class="section-title">🔢 特码号码频次分析（基于全部历史）</div>
      <p style="font-size:0.85rem;color:#555;margin-bottom:12px;">统计每个特码号码的出现次数、概率与冷热状态。</p>
      <div class="table-responsive">
        <table id="specialNumTable">
          <thead><tr><th>号码</th><th>次数</th><th>概率</th><th>状态</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="chart-wrap"><canvas id="specialNumChart"></canvas></div>
    </div>
  </div>

  <!-- 粘贴模态框 -->
  <div class="modal" id="pasteModal">
    <div class="modal-content">
      <h3>📋 粘贴 CSV 文本</h3>
      <p style="font-size:0.8rem; color:#666; margin-bottom:8px;">格式：period,numbers,zodiac<br>示例：20260507114,"17,34,35,18,01,44,10","虎,雞,猴,牛,馬,豬,雞"</p>
      <textarea id="csvTextarea" placeholder="在此粘贴CSV内容..."></textarea>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelPaste">取消</button>
        <button class="btn" id="confirmPaste">加载并解析</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const ZODIAC = ['鼠','牛','虎','兔','龍','蛇','馬','羊','猴','雞','狗','豬'];
      // 全局数据
      let fullDataCache = null;

      // Chart 实例
      let charts = {};

      function destroyChart(key) {
        if (charts[key]) { charts[key].destroy(); charts[key] = null; }
      }

      // CSV 解析
      function parseCSVLine(line) {
        const result = [];
        let cur = '', inQ = false;
        for (let ch of line) {
          if (ch === '"') { inQ = !inQ; }
          else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
          else cur += ch;
        }
        result.push(cur.trim());
        return result;
      }

      function parseCSV(text) {
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length < 2) throw new Error('至少需要标题行和一行数据');
        const header = parseCSVLine(lines[0]).map(h => h.toLowerCase().replace(/"/g,''));
        const idxP = header.indexOf('period'), idxN = header.indexOf('numbers'), idxZ = header.indexOf('zodiac');
        if (idxP === -1 || idxN === -1 || idxZ === -1) throw new Error('缺少必要列 period, numbers, zodiac');
        const data = [];
        for (let i = 1; i < lines.length; i++) {
          const f = parseCSVLine(lines[i]);
          if (f.length < 3) continue;
          const period = f[idxP]?.replace(/"/g,'').trim();
          const numsRaw = f[idxN]?.replace(/"/g,'');
          const zodRaw = f[idxZ]?.replace(/"/g,'');
          if (!period || !numsRaw || !zodRaw) continue;
          const numbers = numsRaw.split(',').map(n => n.trim().padStart(2,'0'));
          const zodiac = zodRaw.split(',').map(z => z.trim());
          if (numbers.length !== 7 || zodiac.length !== 7) continue;
          data.push({ period, numbers, zodiac });
        }
        return data;
      }

      function processCsvText(csvText) {
        try {
          const data = parseCSV(csvText);
          if (data.length === 0) {
            alert('没有有效数据');
            document.getElementById('fileStatus').textContent = '数据解析失败';
            return;
          }
          fullDataCache = data;
          document.getElementById('fileStatus').textContent = `已加载 ${data.length} 期数据`;
        } catch (e) {
          alert('解析错误：' + e.message);
          document.getElementById('fileStatus').textContent = '解析错误';
        }
      }

      // 文件选择
      document.getElementById('csvFile').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('fileStatus').textContent = '读取中...';
        const reader = new FileReader();
        reader.onload = ev => processCsvText(ev.target.result);
        reader.onerror = () => { alert('文件读取失败'); document.getElementById('fileStatus').textContent = '读取失败'; };
        reader.readAsText(file, 'UTF-8');
      });

      // 粘贴功能
      const pasteModal = document.getElementById('pasteModal');
      document.getElementById('pasteBtn').addEventListener('click', () => { pasteModal.style.display = 'flex'; });
      document.getElementById('cancelPaste').addEventListener('click', () => { pasteModal.style.display = 'none'; });
      pasteModal.addEventListener('click', e => { if (e.target === pasteModal) pasteModal.style.display = 'none'; });
      document.getElementById('confirmPaste').addEventListener('click', () => {
        const text = document.getElementById('csvTextarea').value.trim();
        if (!text) { alert('请粘贴内容'); return; }
        processCsvText(text);
        pasteModal.style.display = 'none';
        document.getElementById('csvTextarea').value = '';
      });

      // 通用排序
      function sortData(data) {
        return [...data].sort((a,b) => {
          const na = parseInt(a.period.replace(/\D/g,'')) || 0;
          const nb = parseInt(b.period.replace(/\D/g,'')) || 0;
          return na - nb;
        });
      }

      // 冷热度分类
      function classifyHotCold(arr, countKey = 'count') {
        const values = arr.map(i => i[countKey]);
        const n = values.length;
        const mean = values.reduce((a,b)=>a+b,0)/n;
        const variance = values.reduce((a,b)=>a+(b-mean)**2,0)/n;
        const std = Math.sqrt(variance);
        return arr.map(item => {
          let status = '温';
          if (std > 0) {
            if (item[countKey] >= mean + std) status = '热';
            else if (item[countKey] <= mean - std) status = '冷';
          }
          return { ...item, status };
        });
      }

      function renderTable(tableId, data, colKeys) {
        const tbody = document.querySelector(`#${tableId} tbody`);
        tbody.innerHTML = '';
        data.forEach(item => {
          const tr = document.createElement('tr');
          colKeys.forEach(key => {
            const td = document.createElement('td');
            if (key === 'status') {
              const cls = item.status === '热' ? 'hot' : (item.status === '冷' ? 'cold' : 'warm');
              td.innerHTML = `<span class="badge ${cls}">${item.status}</span>`;
            } else {
              td.textContent = item[key];
            }
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
      }

      function drawBarChart(canvasId, labels, values, label = '次数') {
        destroyChart(canvasId);
        const ctx = document.getElementById(canvasId).getContext('2d');
        charts[canvasId] = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              label,
              data: values,
              backgroundColor: 'rgba(26,35,126,0.7)',
              borderColor: '#1a237e',
              borderWidth: 1,
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });
      }

      // 获取过滤数据
      function getFilteredData() {
        if (!fullDataCache || fullDataCache.length === 0) {
          alert('请先加载 CSV 数据');
          return null;
        }
        const sorted = sortData(fullDataCache);
        let recent = parseInt(document.getElementById('recentPeriods').value) || 0;
        if (isNaN(recent) || recent < 0) recent = 0;
        return recent > 0 ? sorted.slice(-recent) : sorted;
      }

      // ============= 生肖分析 =============
      document.getElementById('analyzeBtn').addEventListener('click', () => {
        const data = getFilteredData();
        if (!data) return;
        const specialPos = document.getElementById('specialPos').value;
        const spIdx = specialPos === 'first' ? 0 : 6;

        const specMap = {}, normMap = {};
        data.forEach(row => {
          const z = row.zodiac;
          specMap[z[spIdx]] = (specMap[z[spIdx]] || 0) + 1;
          z.forEach((s, i) => {
            if (i === spIdx) return;
            normMap[s] = (normMap[s] || 0) + 1;
          });
        });

        const total = data.length;
        let specStats = ZODIAC.map(z => ({
          zodiac: z,
          count: specMap[z] || 0,
          probability: total ? ((specMap[z]||0)/total*100).toFixed(2) : 0
        }));
        const normalSlots = total * 6;
        let normStats = ZODIAC.map(z => ({
          zodiac: z,
          count: normMap[z] || 0,
          probability: normalSlots ? ((normMap[z]||0)/normalSlots*100).toFixed(2) : 0
        }));

        specStats = classifyHotCold(specStats);
        normStats = classifyHotCold(normStats);

        // 按次数降序表格
        specStats.sort((a,b) => b.count - a.count);
        normStats.sort((a,b) => b.count - a.count);

        renderTable('specialTable', specStats, ['zodiac','count','probability','status']);
        renderTable('normalTable', normStats, ['zodiac','count','probability','status']);

        // 图表按生肖顺序
        const specChartData = ZODIAC.map(z => specStats.find(s => s.zodiac === z) || {count:0});
        const normChartData = ZODIAC.map(z => normStats.find(s => s.zodiac === z) || {count:0});
        drawBarChart('specialChart', ZODIAC, specChartData.map(s => s.count));
        drawBarChart('normalChart', ZODIAC, normChartData.map(s => s.count));

        document.getElementById('zodiacResult').style.display = 'block';
        document.getElementById('recommendArea').style.display = 'none';
        document.getElementById('specialNumArea').style.display = 'none';
      });

      // ============= 三中三推荐 =============
      document.getElementById('recommendBtn').addEventListener('click', () => {
        if (!fullDataCache || fullDataCache.length === 0) {
          alert('请先加载数据');
          return;
        }
        const sorted = sortData(fullDataCache);
        const specialIdx = 6; // 默认最后一个为特码
        const freq = new Array(50).fill(0);
        const draws = [];
        sorted.forEach(row => {
          const nums = row.numbers.map(n => parseInt(n,10));
          const normal = [];
          nums.forEach((num, i) => {
            if (i === specialIdx) return;
            if (num >= 1 && num <= 49) { freq[num]++; normal.push(num); }
          });
          draws.push(normal);
        });

        const absent = new Array(50).fill(0);
        if (draws.length) {
          for (let num = 1; num <= 49; num++) {
            let miss = 0;
            for (let i = draws.length-1; i >= 0; i--) {
              if (draws[i].includes(num)) break;
              miss++;
            }
            absent[num] = miss;
          }
        }
        const recent30 = new Array(50).fill(0);
        const recentDraws = draws.slice(-30);
        recentDraws.forEach(draw => draw.forEach(num => { if(num>=1&&num<=49) recent30[num]++; }));

        const scores = [];
        for (let num=1; num<=49; num++) {
          const score = freq[num]*0.5 + recent30[num]*2 - absent[num]*0.3;
          scores.push({ number: num, score });
        }
        scores.sort((a,b) => b.score - a.score);
        const top3 = scores.slice(0,3).map(i => i.number.toString().padStart(2,'0'));
        document.getElementById('recommendNumbers').innerHTML = top3.map(n => `<div class="num-circle">${n}</div>`).join('');
        document.getElementById('recommendArea').style.display = 'block';
        document.getElementById('zodiacResult').style.display = 'none';
        document.getElementById('specialNumArea').style.display = 'none';
      });

      // ============= 特码号码分析 =============
      document.getElementById('specialNumBtn').addEventListener('click', () => {
        if (!fullDataCache || fullDataCache.length === 0) {
          alert('请先加载数据');
          return;
        }
        const sorted = sortData(fullDataCache);
        const specialPos = document.getElementById('specialPos').value;
        const spIdx = specialPos === 'first' ? 0 : 6;

        const countMap = new Array(50).fill(0);
        sorted.forEach(row => {
          const num = parseInt(row.numbers[spIdx], 10);
          if (num >= 1 && num <= 49) countMap[num]++;
        });

        const total = sorted.length;
        let stats = [];
        for (let i = 1; i <= 49; i++) {
          stats.push({
            number: i.toString().padStart(2,'0'),
            count: countMap[i],
            probability: total ? (countMap[i]/total*100).toFixed(2) : 0
          });
        }
        stats = classifyHotCold(stats);
        stats.sort((a,b) => b.count - a.count);

        renderTable('specialNumTable', stats, ['number','count','probability','status']);
        // 图表按号码顺序
        const labels = Array.from({length:49}, (_,i) => (i+1).toString().padStart(2,'0'));
        const values = labels.map(l => {
          const found = stats.find(s => s.number === l);
          return found ? found.count : 0;
        });
        drawBarChart('specialNumChart', labels, values);
        document.getElementById('specialNumArea').style.display = 'block';
        document.getElementById('zodiacResult').style.display = 'none';
        document.getElementById('recommendArea').style.display = 'none';
      });
    })();
  </script>
</body>
</html>
