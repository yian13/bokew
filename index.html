<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简书签导航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .bookmark-card:hover .delete-btn { display: block; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white shadow-sm p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600 flex items-center gap-2">
            <i data-lucide="layout-grid"></i> 我的导航
        </h1>
        <button onclick="toggleAdmin()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-700 transition">
            后台管理
        </button>
    </nav>

    <main class="container mx-auto p-6">
        <div id="bookmark-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            </div>
    </main>

    <div id="admin-panel" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl p-6 transform translate-x-full transition-transform duration-300 z-50 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-bold">后台管理系统</h2>
            <button onclick="toggleAdmin()"><i data-lucide="x"></i></button>
        </div>

        <div class="mb-8">
            <label class="block text-sm font-medium mb-2">批量导入书签</label>
            <textarea id="import-data" rows="5" class="w-full border rounded p-2 text-xs mb-2" placeholder="支持 Via 格式 (每行: 名称|URL) 或粘贴 HTML 源码"></textarea>
            <button onclick="importBookmarks()" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">开始导入</button>
        </div>

        <div>
            <h3 class="text-sm font-bold mb-4">当前书签清单</h3>
            <div id="admin-list" class="space-y-2"></div>
        </div>
        
        <button onclick="clearAll()" class="w-full mt-10 text-red-500 text-xs underline">清空所有数据</button>
    </div>

    <script>
        let bookmarks = JSON.parse(localStorage.getItem('my_bookmarks') || '[]');

        function init() {
            renderBookmarks();
            lucide.createIcons();
        }

        // 渲染前端
        function renderBookmarks() {
            const list = document.getElementById('bookmark-list');
            list.innerHTML = bookmarks.map((b, index) => `
                <a href="${b.url}" target="_blank" class="bookmark-card bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition border border-transparent hover:border-blue-300 relative">
                    <div class="flex items-center gap-3">
                        <img src="https://www.google.com/s2/favicons?domain=${b.url}" class="w-6 h-6 rounded">
                        <div class="overflow-hidden">
                            <div class="text-sm font-medium truncate">${b.title}</div>
                            <span class="status-dot bg-gray-300" id="dot-${index}"></span>
                            <span class="text-[10px] text-gray-400">检测中</span>
                        </div>
                    </div>
                </a>
            `).join('');
            
            // 渲染后启动检测
            bookmarks.forEach((b, i) => checkStatus(b.url, i));
        }

        // 后台管理渲染
        function renderAdminList() {
            const list = document.getElementById('admin-list');
            list.innerHTML = bookmarks.map((b, index) => `
                <div class="flex justify-between items-center text-sm p-2 border-b">
                    <span class="truncate w-40">${b.title}</span>
                    <button onclick="deleteBookmark(${index})" class="text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // 检测书签状态 (前端模拟版)
        async function checkStatus(url, index) {
            const dot = document.getElementById(`dot-${index}`);
            const timer = setTimeout(() => {
                dot.className = "status-dot bg-blue-500"; // 超时大概率需VPN
                dot.nextElementSibling.innerText = "需VPN";
            }, 3000);

            try {
                // 使用 fetch 的 no-cors 模式尝试触发请求
                await fetch(url, { mode: 'no-cors' });
                clearTimeout(timer);
                dot.className = "status-dot bg-green-500";
                dot.nextElementSibling.innerText = "正常";
            } catch (e) {
                // 如果 fetch 报错且不是跨域错误，可能是失效
                clearTimeout(timer);
                dot.className = "status-dot bg-red-500";
                dot.nextElementSibling.innerText = "失效";
            }
        }

        // 导入逻辑 (兼容 Via)
        function importBookmarks() {
            const raw = document.getElementById('import-data').value;
            let newBookmarks = [];

            if (raw.includes('|')) {
                // 解析 Via 格式: 名称|URL
                raw.split('\n').forEach(line => {
                    const [title, url] = line.split('|');
                    if (title && url) newBookmarks.push({ title: title.trim(), url: url.trim() });
                });
            } else {
                // 解析通用 HTML 格式
                const parser = new DOMParser();
                const doc = parser.parseFromString(raw, 'text/html');
                const links = doc.querySelectorAll('a');
                links.forEach(a => {
                    newBookmarks.push({ title: a.innerText, url: a.href });
                });
            }

            bookmarks = [...bookmarks, ...newBookmarks];
            save();
            alert(`成功导入 ${newBookmarks.length} 个书签`);
        }

        function deleteBookmark(index) {
            bookmarks.splice(index, 1);
            save();
        }

        function save() {
            localStorage.setItem('my_bookmarks', JSON.stringify(bookmarks));
            renderBookmarks();
            renderAdminList();
        }

        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('translate-x-full');
            renderAdminList();
        }

        function clearAll() {
            if(confirm('确定清空？')) { bookmarks = []; save(); }
        }

        init();
    </script>
</body>
</html>
